<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-1">Merchant Payments Portal</h4>
        <p class="text-muted small mb-4">Sign in with your role credentials</p>

        @if (error()) {
          <div class="alert alert-danger py-2 small" role="alert">{{ error() }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" formControlName="email" placeholder="sales@merchantportal.test" />
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" formControlName="password" placeholder="Password123!" />
          </div>

          <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid || loading()">
            @if (loading()) {
              <span class="spinner-border spinner-border-sm me-2"></span>Signing in...
            } @else {
              Sign In
            }
          </button>
        </form>

        <hr class="my-4" />
        <div class="small text-muted">
          <div class="fw-semibold mb-1">Test Accounts (Password: Password123!)</div>
          <div class="d-flex flex-wrap gap-1">
            <button type="button" class="btn btn-outline-secondary btn-sm" (click)="fill('sales@merchantportal.test')">SALES</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" (click)="fill('reviewer@merchantportal.test')">REVIEWER</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" (click)="fill('admin@merchantportal.test')">ADMIN</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
