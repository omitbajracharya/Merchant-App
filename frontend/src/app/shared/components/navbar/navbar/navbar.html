@if (auth.isAuthenticated()) {
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" routerLink="/dashboard">
        <i class="bi bi-shield-check me-2"></i>Merchant Portal
      </a>

      <div class="d-flex align-items-center gap-3">
        <a class="nav-link text-light" routerLink="/dashboard" routerLinkActive="fw-bold text-info">
          Dashboard
        </a>

        @if (auth.hasRole(['SALES', 'ADMIN'])) {
          <a class="btn btn-sm btn-primary" routerLink="/applications/new">
            <i class="bi bi-plus-lg me-1"></i>New Application
          </a>
        }

        <span class="badge bg-secondary">{{ auth.role() }}</span>
        <span class="text-light small d-none d-md-inline">{{ auth.user()?.fullName }}</span>

        <button class="btn btn-sm btn-outline-light" (click)="auth.logout()">
          Logout
        </button>
      </div>
    </div>
  </nav>
}
